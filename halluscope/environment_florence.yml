# Florence-2 environment: only for src/2_object_annotation/2_florence_objs_detection.py.
# Florence-2's remote code does not work with transformers 5.x, which the rest of the pipeline needs.
#   conda env create -f environment_florence.yml
#   conda activate halluscope-florence
name: halluscope-florence
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.2.0
      - torchvision==0.17.0
      - transformers==4.53.2
      - accelerate==1.15.0
      - pillow==11.3.0
      - numpy==1.26.4
      - tqdm==4.67.1
      - timm==1.0.17
      - einops==0.8.1
